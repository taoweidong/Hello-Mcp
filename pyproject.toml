[build-system]
requires = ["setuptools>=75.8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-mcp"
version = "0.1.0"
description = "FastMCP 示例项目集合"
requires-python = ">=3.10"
dependencies = [
    "dashscope>=1.25.2",
    "fastmcp>=2.13.1",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    "typing-extensions>=4.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]
# 仅遗留爬虫脚本需要（legacy/douban_movie_scraper.py）
scrape = [
    "beautifulsoup4>=4.14.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "playwright>=1.57.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
